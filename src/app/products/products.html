<h2>Products</h2>

@if(showCreate){
  <h1>Create Product</h1>
  <form>
    <div>
      <label>Name</label>
      <input type="text" [(ngModel)]="newProduct.name" name="newProductName">
    </div>
    <div>
      <label>Price</label>
      <input type="number" [(ngModel)]="newProduct.price" name="newProductPrice">
    </div>
  </form>
}

<button (click)="getProduct(2)">Get product</button>

<p>Total Products: {{ products.length }}</p>
@if(selectedProduct){
  <div>
    <h1>You have selected: {{selectedProduct.name}}</h1>
    <form (ngSubmit)="saveProduct()">
      <div>
        <label>Name</label>
        <input type="text" [(ngModel)]="selectedProduct.name" name="name">
      </div>
      <div>
        <label>Price</label>
        <input type="number" [(ngModel)]="selectedProduct.price" name="price">
      </div>
      <button type="submit">
        Save
      </button>
    </form>
  </div>
}

<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Price</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let product of products">
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.price }}</td>
      <td><button (click) = "onDeleteClick(product.id)">Delete</button></td>
      <td><button (click) = "selectProduct(product)">Select</button></td>
    </tr>
  </tbody>
</table>
