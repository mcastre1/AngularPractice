@if(showCreate){
<h1>Create Product</h1>
<form>
  <div>
    <label>Name</label>
    <input type="text" [(ngModel)]="newProduct.name" name="newProductName">
  </div>
  <div>
    <label>Price</label>
    <input type="number" [(ngModel)]="newProduct.price" name="newProductPrice">
  </div>
  <button type="submit" mat-raised-button (click)="createProduct()">Create</button>
</form>
}

<div class="toolbar">
  <h2>Products</h2>
  <button matFab class="custom-fab add-button" (click)="showCreateProduct()">
    @if(showCreate){
      <mat-icon>close</mat-icon>
    }
    @else{
      <mat-icon>add</mat-icon>
    }
    
  </button>
</div>

<p>Total Products: {{ products.length }}</p>
@if(selectedProduct){
<div>
  <h1>You have selected: {{selectedProduct.name}}</h1>
  <form (ngSubmit)="saveProduct()">
    <div>
      <label>Name</label>
      <input type="text" [(ngModel)]="selectedProduct.name" name="name">
    </div>
    <div>
      <label>Price</label>
      <input type="number" [(ngModel)]="selectedProduct.price" name="price">
    </div>
    <button type="submit">
      Save
    </button>
  </form>
</div>
}

<div class="table-container">
  <table mat-table [dataSource]="products">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let product">
        {{product.id}}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> NAME </th>
      <td mat-cell *matCellDef="let product">
        {{product.name}}
      </td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> PRICE </th>
      <td mat-cell *matCellDef="let product">
        {{product.price}}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> ACTIONS </th>
      <td mat-cell *matCellDef="let product">
        <button matButton (click)="selectProduct(product)">Update</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
