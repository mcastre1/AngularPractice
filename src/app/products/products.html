<h2>Products</h2>

<p>Total Products: {{ products.length }}</p>

<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Price</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for(product of products; track product.id){
    <tr>
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.price }}</td>
      <td><button (click)="onDeleteClick(product.id)">Delete</button></td>
    </tr>
    }
  </tbody>
</table>
